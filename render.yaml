# Render Blueprint: 이 파일이 있으면 Render가 빌드/시작 명령을 자동 인식합니다.
# 사용자가 Render UI에서 일일이 입력할 필요 없음.
services:
  - type: web
    name: trading-journal-backend
    runtime: python
    plan: free
    region: singapore   # 한국에서 가장 가까운 리전
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true    # GitHub push 시 자동 재배포
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
